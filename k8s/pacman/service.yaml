apiVersion: v1
kind: Service
metadata:
  name: pacman
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  selector:
    app: pacman
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
